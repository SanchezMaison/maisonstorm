:root{--ink:#050608;--white:#f4f6fb;--red:#e10600;--sky:#ff8a80;--gray:#8a91a3;--goth:'UnifrakturCook','Old English Text MT',serif;--graf:'Sedgwick Ave Display','Permanent Marker',cursive;--marker:'Permanent Marker','Marker Felt',cursive;--pirata:'Pirata One','UnifrakturCook',serif;--sans:'Archivo','Arial Narrow',Arial,sans-serif}

:root{--catfont:var(--graf)}</style></head><body><a class="skip" href="#main">Ir al contenido</a><div class="curtain" id="curtain"></div><a class="wafab" id="wafab" href="#" target="_blank" rel="noopener" aria-label="Escribir por WhatsApp">WhatsApp</a><div class="bar"><button class="burger" id="mbtn" aria-label="Abrir menú" aria-expanded="false" aria-controls="menu"><i></i><i></i><i></i></button><a class="logo" href="index.html">Storm Maison</a><span></span></div><nav class="menu" id="menu" aria-label="Principal"><a class="f-goth" href="index.html">Inicio</a><a class="f-graf" href="perfumes.html" aria-current="page">Perfumes</a><a class="f-marker" href="ropa.html">Ropa</a><a class="f-goth" href="selectos.html">Selectos</a><a class="f-pirata" href="#contacto">Contacto</a><small>Envíos y disponibilidad por WhatsApp</small></nav><main id="main"><header class="phead"><h1 class="f-graf">Perfumes</h1><p>Fragancias para cada ocasión.</p></header><div class="search"><input id="q" type="search" aria-label="Buscar productos" autocomplete="off"><span id="count" aria-live="polite"></span></div><div class="grid" id="grid"></div><div class="tape" aria-hidden="true"><div id="tape"></div></div><a class="door" href="ropa.html"><h2 class="f-marker">Ropa</h2><p>Siguiente</p><span class="go" aria-hidden="true">›</span></a></main><footer id="contacto"><h2><span class="f-goth">Storm</span> <span class="f-graf">Maison</span></h2><a class="buy" id="foot-wa" href="#" target="_blank" rel="noopener">Escríbenos por WhatsApp</a><nav class="flinks" aria-label="Secciones"><a href="perfumes.html">Perfumes</a><a href="ropa.html">Ropa</a><a href="selectos.html">Selectos</a></nav><small>Calidad, buen trato y buenos precios.</small></footer><script>
const WHATSAPP="527205503984";
const wa=t=>"https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(t);
document.getElementById("foot-wa").href=wa("Hola, quiero información de Storm Maison.");
document.getElementById("tape").innerHTML=Array(8).fill('<b class="f-graf">Perfumes</b> ✦ <b class="f-marker">Ropa</b> ✦ <b class="f-goth">Selectos</b> ✦ ').join("");
const menu=document.getElementById("menu"),mbtn=document.getElementById("mbtn");
const toggle=o=>{menu.classList.toggle("open",o);mbtn.setAttribute("aria-expanded",o);mbtn.setAttribute("aria-label",o?"Cerrar menú":"Abrir menú");document.body.classList.toggle("lock",o)};
mbtn.onclick=()=>toggle(!menu.classList.contains("open"));
menu.querySelectorAll("a").forEach(a=>a.addEventListener("click",()=>toggle(false)));
addEventListener("keydown",e=>{if(e.key==="Escape")toggle(false)});
document.getElementById("wafab").href=wa("Hola, quiero información de Storm Maison.");
const curt=document.getElementById("curtain"),calm=matchMedia("(prefers-reduced-motion: reduce)").matches;
const hideCurt=()=>{curt.style.transform="translateY(-101%)"};
if(!calm){curt.style.transition="none";curt.style.transform="none";void curt.offsetWidth;curt.style.transition="";requestAnimationFrame(()=>requestAnimationFrame(hideCurt))}
addEventListener("pageshow",e=>{if(e.persisted){curt.style.transition="none";hideCurt()}});
document.addEventListener("click",e=>{
 const a=e.target.closest("a[href]");
 if(!a||calm||e.metaKey||e.ctrlKey||e.shiftKey||a.target==="_blank")return;
 const u=new URL(a.href,location.href);
 if(u.origin!==location.origin||u.pathname===location.pathname)return;
 e.preventDefault();
 curt.style.transition="none";curt.style.transform="translateY(101%)";void curt.offsetWidth;curt.style.transition="";curt.style.transform="none";
 setTimeout(()=>{location.href=a.href},560);
});
const SECCION="Perfumes";

// ====== Edita aquí: "img" es opcional (ruta de la imagen), "precio" puede ir vacío ======
const PRODUCTOS=[
 {
  "nombre": "Jean Paul Gaultier Le Beau",
  "detalle": "Eau De Parfum, etc.",
  "precio": "2780",
  "img": "img/perfume001.jpg"
 },
 {
  "nombre": "002",
  "detalle": "",
  "precio": "",
  "img": "img/perfume002.jpg"
 },
 {
  "nombre": "003",
  "detalle": "",
  "precio": "",
  "img": "img/perfume003.jpg"
 },
 {
  "nombre": "004",
  "detalle": "",
  "precio": "",
  "img": "img/perfume004.jpg"
 },
 {
  "nombre": "005",
  "detalle": "",
  "precio": "",
  "img": "img/perfume005.jpg"
 },
 {
  "nombre": "006",
  "detalle": "",
  "precio": "",
  "img": "img/perfume006.jpg"
 },
 {
  "nombre": "007",
  "detalle": "",
  "precio": "",
  "img": "img/perfume007.jpg"
 },
 {
  "nombre": "008",
  "detalle": "",
  "precio": "",
  "img": "img/perfume008.jpg"
 }
];
// ========================
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const grid=document.getElementById("grid"),q=document.getElementById("q"),count=document.getElementById("count");
q.placeholder="Buscar en "+SECCION;
const card=p=>`<article class="card"><button class="pic" data-i="${PRODUCTOS.indexOf(p)}" aria-label="Ver ${esc(p.nombre)}">${p.img?`<img src="${esc(p.img)}" alt="${esc(SECCION+' '+p.nombre)}" loading="lazy">`:`<span>${esc(p.nombre[0])}</span>`}</button><div class="info"><h3>${esc(p.nombre)}</h3><em>${esc(p.detalle)}</em><b>${p.precio?esc(p.precio):"Consulta el precio"}</b></div><a class="buy" target="_blank" rel="noopener" href="${wa("Hola, quiero consultar disponibilidad de: "+SECCION+" "+p.nombre)}">Lo quiero</a></article>`;
const norm=s=>String(s).toLowerCase().normalize("NFD").split("").filter(c=>c.charCodeAt(0)<768||c.charCodeAt(0)>879).join("");
const draw=()=>{
 const t=norm(q.value.trim());
 const l=PRODUCTOS.filter(p=>norm(p.nombre+" "+p.detalle).includes(t));
 grid.innerHTML=l.length?l.map(card).join(""):`<p class="empty">${PRODUCTOS.length?"No encontramos «"+esc(q.value)+"» en "+SECCION+".":"Pronto habrá piezas."} <a href="${wa("Hola, busco en "+SECCION+": "+q.value)}" target="_blank" rel="noopener">Pregúntanos por WhatsApp</a></p>`;
 count.textContent=t?l.length+" de "+PRODUCTOS.length:PRODUCTOS.length+(PRODUCTOS.length===1?" pieza":" piezas");
};
q.addEventListener("input",draw);draw();
const dlg=document.createElement("div");
dlg.className="dlg";dlg.hidden=true;dlg.setAttribute("role","dialog");dlg.setAttribute("aria-modal","true");dlg.setAttribute("aria-label","Detalle del producto");
dlg.innerHTML='<div class="dlg-in"><button class="dlg-x" aria-label="Cerrar">×</button><div class="dlg-pic"></div><div class="dlg-info"><h3></h3><em></em><b></b><div class="dlg-nav"><button class="dlg-p" aria-label="Anterior">‹</button><button class="dlg-s" aria-label="Siguiente">›</button></div><a class="buy" target="_blank" rel="noopener">Lo quiero</a></div></div>';
document.body.appendChild(dlg);
let ix=0;
const $=x=>dlg.querySelector(x);
const show=i=>{ix=(i+PRODUCTOS.length)%PRODUCTOS.length;const p=PRODUCTOS[ix];
 $(".dlg-pic").innerHTML=p.img?'<img src="'+esc(p.img)+'" alt="'+esc(SECCION+" "+p.nombre)+'">':"<span>"+esc(p.nombre[0])+"</span>";
 $("h3").textContent=p.nombre;$("em").textContent=p.detalle;$("b").textContent=p.precio||"Consulta el precio";
 $(".buy").href=wa("Hola, quiero consultar disponibilidad de: "+SECCION+" "+p.nombre)};
const closeD=()=>{dlg.hidden=true;document.body.classList.remove("lock")};
grid.addEventListener("click",e=>{const b=e.target.closest(".pic");if(!b)return;show(+b.dataset.i);dlg.hidden=false;document.body.classList.add("lock");$(".dlg-x").focus()});
dlg.addEventListener("click",e=>{if(e.target===dlg||e.target.closest(".dlg-x"))closeD();if(e.target.closest(".dlg-p"))show(ix-1);if(e.target.closest(".dlg-s"))show(ix+1)});
addEventListener("keydown",e=>{if(dlg.hidden)return;if(e.key==="Escape")closeD();if(e.key==="ArrowRight")show(ix+1);if(e.key==="ArrowLeft")show(ix-1)});
</script></body></html>
